<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Background plate -->
  <rect width="800" height="200" rx="24" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>

  <!-- Symbol Lockup -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="140" height="140" rx="28" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

    <!-- Crop Marks (stroke 6 for crisp small rendering) -->
