<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viewlint Brand Identity Redesign & Comparison Sheet</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #0B0F19;
      color: #F8FAFC;
    }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #38BDF8; }
    p.subtitle { color: #94A3B8; font-size: 15px; margin-top: 0; margin-bottom: 32px; }
    .section {
      margin-bottom: 40px;
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 16px;
      padding: 24px;
    }
    h2 { font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 16px; border-bottom: 1px solid #1E293B; padding-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card {
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card-dark { background: #0B0F19; border: 1px solid #1E293B; color: #F8FAFC; }
    .card-light { background: #FFFFFF; border: 1px solid #E2E8F0; color: #0F172A; }
    .card label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; opacity: 0.7; }
    .size-row { display: flex; align-items: center; gap: 24px; margin-top: 12px; }
    img.social-img { max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #1E293B; }
  </style>
</head>
<body>

  <h1>Viewlint — Brand Identity Redesign (Adaptive Viewport Monogram)</h1>
  <p class="subtitle">Complete ground-up logo identity, technical symbolism, and quality verification sheet.</p>

  <div class="section">
    <h2>1. Primary Logo Variants</h2>
    <div class="grid">
      <div class="card card-dark">
        <img src="viewlint-logo-dark.svg" alt="Dark Theme Logo" width="380">
        <label>Dark Theme Lockup (`viewlint-logo-dark.svg`)</label>
      </div>
      <div class="card card-light">
        <img src="viewlint-logo-light.svg" alt="Light Theme Logo" width="380">
        <label>Light Theme Lockup (`viewlint-logo-light.svg`)</label>
      </div>
      <div class="card card-dark">
        <img src="viewlint-logo-mono.svg" alt="Monochrome Logo" width="380" style="color: #F8FAFC;">
        <label>Monochrome Vector Lockup (`viewlint-logo-mono.svg`)</label>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>2. Symbol Legibility at Small Scale (16px, 32px, 64px, 128px)</h2>
    <div class="grid">
      <div class="card card-dark">
        <div class="size-row">
          <img src="viewlint-symbol.svg" width="16" height="16" alt="16px">
          <img src="viewlint-symbol.svg" width="32" height="32" alt="32px">
          <img src="viewlint-symbol.svg" width="64" height="64" alt="64px">
          <img src="viewlint-symbol.svg" width="128" height="128" alt="128px">
        </div>
        <label>SVG Symbol Scaling Test</label>
      </div>
      <div class="card card-light">
        <div class="size-row">
          <img src="viewlint-icon-512.png" width="16" height="16" alt="16px">
          <img src="viewlint-icon-512.png" width="32" height="32" alt="32px">
          <img src="viewlint-icon-512.png" width="64" height="64" alt="64px">
          <img src="viewlint-icon-512.png" width="128" height="128" alt="128px">
        </div>
        <label>Raster PNG Avatar Scaling Test</label>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>3. Open Graph Repository Social Preview (1280×640)</h2>
    <img src="viewlint-social-preview.png" alt="Social Preview" class="social-img">
  </div>

</body>
</html>
