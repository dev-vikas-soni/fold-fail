name: Viewlint Adaptive Quality Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  viewlint-audit:
    name: Run Viewlint Audit & Upload SARIF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Test Suite & Generate SARIF Report
        run: ./gradlew test viewlint

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: '**/build/reports/viewlint/viewlint-report.sarif'
          category: viewlint-audit
